; =====================================================================
; Commandes NSClient++ pour la supervision des licences Oracle.
;
; A fusionner dans nsclient.ini, ou a inclure depuis celui-ci.
; Rechargez le service apres modification :
;     net stop nscp && net start nscp
;
; NRPE sous Windows passe par NSClient++ : il n'existe pas d'agent NRPE
; natif Microsoft. Le poller Centreon interroge donc le port 5666 de la
; meme maniere que sur Linux, et les commandes ci-dessous rendent la
; meme sortie et les memes codes retour que la variante Unix.
; =====================================================================

[/modules]
CheckExternalScripts = enabled
NRPEServer = enabled

[/settings/NRPE/server]
port = 5666
; NRPE doit transmettre les arguments (le SID) : sans cela, une seule
; instance par serveur serait supervisable.
allow arguments = true
; Ne jamais activer "allow nasty characters" : les commandes ci-dessous
; n'en ont pas besoin, et cela ouvrirait une injection de commande.
allow nasty characters = false

[/settings/external scripts]
; Le plugin lit un fichier de cache : il repond en quelques dizaines de
; millisecondes. Cette marge ne couvre que la latence.
timeout = 30

[/settings/external scripts/scripts]

; La construction "echo ... | powershell -command -" est necessaire :
; sans elle, NSClient++ recupere le code retour de powershell.exe et non
; celui du script, et tous les controles remonteraient OK.

oracle_lic_options=cmd /c echo powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\oracle-licensing\check_oracle_licensing.ps1" -Sid $ARG1$ -Mode options; exit($lastexitcode) | powershell.exe -command -

oracle_lic_processors=cmd /c echo powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\oracle-licensing\check_oracle_licensing.ps1" -Sid $ARG1$ -Mode processors; exit($lastexitcode) | powershell.exe -command -

oracle_lic_sessions=cmd /c echo powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\oracle-licensing\check_oracle_licensing.ps1" -Sid $ARG1$ -Mode sessions -WarnThreshold $ARG2$ -CritThreshold $ARG3$; exit($lastexitcode) | powershell.exe -command -

oracle_lic_freshness=cmd /c echo powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\oracle-licensing\check_oracle_licensing.ps1" -Sid $ARG1$ -Mode freshness; exit($lastexitcode) | powershell.exe -command -

oracle_lic_inventory=cmd /c echo powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\oracle-licensing\check_oracle_licensing.ps1" -Sid $ARG1$ -Mode inventory; exit($lastexitcode) | powershell.exe -command -
