; =====================================================================
; Commandes NSClient++ pour la supervision des licences Oracle.
;
; VARIANTE VBSCRIPT -- reservee aux serveurs SANS PowerShell.
;
; A n'utiliser que sur :
;   - Windows Server 2003 / 2003 R2, qui n'embarque aucun PowerShell ;
;   - Windows Server 2008 reste en PowerShell 1.0, insuffisant ici ;
;   - tout serveur ou une strategie de groupe interdit l'execution de
;     scripts PowerShell.
;
; Partout ailleurs, utilisez windows\nsclient-oracle-licensing.ini :
; PowerShell est la voie principale, et VBScript est deprecie par
; Microsoft depuis 2023 -- livre jusqu'a Server 2025, puis fonctionnalite
; a la demande.
;
; N'incluez JAMAIS les deux fichiers a la fois : les noms de commandes
; sont identiques et NSClient++ ne doit en voir qu'une definition.
;
; Rechargez le service apres modification :
;     net stop nscp && net start nscp
; =====================================================================

[/modules]
CheckExternalScripts = enabled
NRPEServer = enabled

[/settings/NRPE/server]
port = 5666
allow arguments = true
allow nasty characters = false

[/settings/external scripts]
timeout = 30

[/settings/external scripts/scripts]

; cscript propage directement le code retour de WScript.Quit : aucune
; construction particuliere n'est necessaire, contrairement a la
; variante PowerShell.

oracle_lic_options=cscript //NoLogo //B "C:\Program Files\oracle-licensing\check_oracle_licensing.vbs" /Sid:$ARG1$ /Mode:options

oracle_lic_processors=cscript //NoLogo //B "C:\Program Files\oracle-licensing\check_oracle_licensing.vbs" /Sid:$ARG1$ /Mode:processors

oracle_lic_sessions=cscript //NoLogo //B "C:\Program Files\oracle-licensing\check_oracle_licensing.vbs" /Sid:$ARG1$ /Mode:sessions /Warning:$ARG2$ /Critical:$ARG3$

oracle_lic_freshness=cscript //NoLogo //B "C:\Program Files\oracle-licensing\check_oracle_licensing.vbs" /Sid:$ARG1$ /Mode:freshness

oracle_lic_inventory=cscript //NoLogo //B "C:\Program Files\oracle-licensing\check_oracle_licensing.vbs" /Sid:$ARG1$ /Mode:inventory
