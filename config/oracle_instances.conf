# oracle_instances.conf
#
# Optional explicit instance list.
# If this file contains active entries, it is preferred over autodiscovery.
#
# Format:
#   SID|ORACLE_HOME
#
# Linux examples:
# ORCL|/u01/app/oracle/product/19.0.0/dbhome_1
# LEGACY|/opt/oracle/product/10.2.0/db_1
#
# Windows examples:
# ORCL|C:\oracle\product\19.0.0\dbhome_1
# LEGACY|D:\oracle\product\10.2.0\db_1
#
# Leave this file with comments only to use:
# - /etc/oratab on Linux
# - OracleService<SID> service discovery on Windows
