# =====================================================================
# /etc/nrpe.d/oracle-licensing.cfg
#
# Commandes NRPE de supervision des licences Oracle.
#
# Toutes lisent le cache local produit par le timer systemd : aucune ne
# se connecte a la base, donc aucune ne peut depasser le timeout NRPE ni
# peser sur la production.
#
# Le compte NRPE n'a besoin que du droit de LECTURE sur
# /var/cache/oracle-licensing. Aucune entree sudoers n'est requise :
# c'est volontaire, et cela doit le rester.
#
# Rechargez NRPE apres modification : systemctl reload nrpe
# =====================================================================

# $ARG1$ = SID de l'instance
command[oracle_lic_options]=/usr/lib/nagios/plugins/check_oracle_licensing.sh -s $ARG1$ -m options
command[oracle_lic_processors]=/usr/lib/nagios/plugins/check_oracle_licensing.sh -s $ARG1$ -m processors
command[oracle_lic_freshness]=/usr/lib/nagios/plugins/check_oracle_licensing.sh -s $ARG1$ -m freshness
command[oracle_lic_inventory]=/usr/lib/nagios/plugins/check_oracle_licensing.sh -s $ARG1$ -m inventory

# $ARG2$ = seuil warning, $ARG3$ = seuil critical sur le high-water mark
command[oracle_lic_sessions]=/usr/lib/nagios/plugins/check_oracle_licensing.sh -s $ARG1$ -m sessions -w $ARG2$ -c $ARG3$

# Variante autorisant le poller a imposer la liste des options detenues
# plutot que de s'en remettre au fichier de configuration local.
#
# ATTENTION : n'activez ceci que si dont_blame_nrpe=0 reste en vigueur.
# La liste transite en clair dans la commande NRPE et tout client
# autorise peut la modifier -- la declaration contractuelle serait alors
# pilotee depuis le reseau, ce qui vide le controle de son sens.
# La configuration locale reste l'option recommandee.
#command[oracle_lic_options_arg]=/usr/lib/nagios/plugins/check_oracle_licensing.sh -s $ARG1$ -m options --licensed-options "$ARG2$"
